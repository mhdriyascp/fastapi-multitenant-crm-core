[project]
name = "backend"
version = "0.1.0"
description = "Enterprise CRM & IAM Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.2",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.15.1",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.30.0",
    "uuid-utils>=1.2.0",
    "scalar-fastapi>=1.9.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[project.scripts]
worker = "arq.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
